services:
  - type: web
    name: goodeats-landing
    runtime: static
    buildCommand: |
      set -eu
      rm -rf public
      mkdir -p public/images public/fonts
      cp index.html public/index.html
      if [ -f images/group-order-editorial.jpg ]; then image=images/group-order-editorial.jpg; else image=group-order-editorial.jpg; fi
      if [ -f fonts/BricolageGrotesque-latin.woff2 ]; then font=fonts/BricolageGrotesque-latin.woff2; license=fonts/OFL.txt; else font=BricolageGrotesque-latin.woff2; license=OFL.txt; fi
      cp "$image" public/images/group-order-editorial.jpg
      cp "$font" public/fonts/BricolageGrotesque-latin.woff2
      cp "$license" public/fonts/OFL.txt
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
