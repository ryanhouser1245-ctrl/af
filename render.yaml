services:
  - type: web
    name: goodeats-landing
    runtime: static
    buildCommand: |
      set -eu
      rm -rf public
      mkdir -p public/images public/fonts
      cp index.html public/index.html
      copy_image() {
        name="$1"
        if [ -f "images/$name" ]; then source="images/$name"
        elif [ -f "$name" ]; then source="$name"
        else echo "Missing required image: $name" >&2; exit 1
        fi
        cp "$source" "public/images/$name"
      }
      copy_image group-order-editorial.jpg
      copy_image community-food-01.jpg
      copy_image community-food-02.jpg
      copy_image community-food-03.jpg
      if [ -f fonts/BricolageGrotesque-latin.woff2 ]; then font=fonts/BricolageGrotesque-latin.woff2; license=fonts/OFL.txt; else font=BricolageGrotesque-latin.woff2; license=OFL.txt; fi
      cp "$font" public/fonts/BricolageGrotesque-latin.woff2
      cp "$license" public/fonts/OFL.txt
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
