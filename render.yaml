services:
  - type: web
    name: goodeats-landing
    runtime: static
    buildCommand: rm -rf public && mkdir -p public/images public/fonts && cp index.html public/index.html && cp images/group-order-editorial.jpg public/images/group-order-editorial.jpg && cp fonts/BricolageGrotesque-latin.woff2 public/fonts/BricolageGrotesque-latin.woff2 && cp fonts/OFL.txt public/fonts/OFL.txt
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
